[project]
name = "ai-role-upgrade-roadmap"
version = "0.4.2"
description = "Companion labs for the AI Role Upgrade Roadmap — Part 4 backend track uses LangChain Academy plus explicit memory-system labs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Neeraj Singh" }]
dependencies = [
    "langgraph",
    "langgraph-prebuilt",
    "langgraph-sdk",
    "langgraph-checkpoint-sqlite",
    "langsmith>=0.7.31",
    "langchain-community",
    "langchain-core>=1.2.28",
    "langchain-openai>=1.1.14",
    "langchain-text-splitters>=1.1.2",
    "notebook",
    "langchain-tavily",
    "wikipedia",
    "trustcall",
    "langgraph-cli[inmem]",
    "aiohttp>=3.13.4",
    "Pygments>=2.20.0",
    "cryptography>=46.0.7",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
memory = [
    "langmem",
    "hindsight-client>=0.9.2",
]


[tool.uv]
package = false
